<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .BORDER {
        width: 300px;
        height: 300px;
        border: 10px solid transparent;
        border-image: url("img/foot_dog.png") 50 round;
        outline: 10px groove orange;
        outline-offset: 10px;
        margin: 10% auto;
      }

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="BORDER">
      <div class="frame">
        <img src="img/dog.png" alt="dog" />
      </div>
    </div>
  </body>
</html>
