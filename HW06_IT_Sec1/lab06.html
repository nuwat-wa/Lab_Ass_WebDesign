<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .test {
        background-color: RGB(74, 255, 156);
        border-bottom: 10px solid green;
      }

      .test1 {
        border: 8px groove red;
      }

      .test2 {
        border-top: 10px double blue;
        border-left: 10px groove RGB(1, 150, 68);
        border-bottom: 8px dashed RGB(255, 136, 0);
      }

      .test3 {
        background-color: RGB(127, 150, 255);
        margin: 10%;
        padding: 10px;
        text-align: center;
      }

      .test4 {
        background-color: yellow;
        border: 2px solid red;
        margin: 0px 30% 0px;
        text-align: center;
        padding: 10px;
      }

      .main {
        text-align: center;
        width: 500px;
        height: 200px;
        margin: 10% auto;
        padding: 20px;
        border: 10px ridge RGB(255, 136, 0);
        border-radius: 10px;
      }

      .main h1 {
        border-top: 10px dashed black;
        border-left: 8px groove RGB(1, 150, 68);
        border-right: 10px double blue;
        border-bottom: 10px dotted RGB(255, 136, 0);
        padding: 30px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1 class="test">THIS IS A HEADING</h1>
    <p class="test1">THIS IS A PARAGRAPH</p>
    <p class="test2">THIS IS A PARAGRAPH</p>
    <h1 class="test3">THIS IS A HEADING</h1>
    <p class="test4">THIS IS A PARAGRAPH</p>

    <div class="main">
      <h1>HELLO WORLD!</h1>
    </div>
  </body>
</html>
